<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
  </defs>
  <!-- Rounded square base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Signature silver double-bezel (mirrors Services accordion) -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="9.5" fill="none" stroke="#e0e0e0" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Serif RC monogram -->
  <text x="32" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f0f0f0" letter-spacing="1">RC</text>
</svg>
