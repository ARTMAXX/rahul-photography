name = "rahul-photography"
main = ".open-next/worker.js"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "94c6a8cbaf0496c5dc637910f4efeec7"

# Google Analytics 4 — measurement ID is public (sent in client JS),
# so it's safe to set here. NEXT_PUBLIC_ prefix exposes it to the client.
[vars]
NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-YMQ3NXLTM4"

# Static assets from the OpenNext build
INDEXNOW_KEY = "6c8c1d3d2971605e76e178410078f24f"
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare Images binding — enables real image resizing in the
# /_next/image handler. Without it, OpenNext's image handler silently
# returns ORIGINAL full-size images for every ?w= variant (verified
# 2026-09-06: ?w=256 and ?w=750 responses were byte-identical to the
# source files), which wastes ~479 KiB per homepage load. With this
# binding, Next's responsive srcset actually serves resized variants.
# NOTE: requires Image transformations to be enabled for the zone
# (verified working: /cdn-cgi/image/width=256/... returned a resized file).
[images]
binding = "IMAGES"

# Keep unbound routes config empty — custom domains are configured in the
# Cloudflare dashboard (rahulchandaphotography.com + www) and persist across deploys.
