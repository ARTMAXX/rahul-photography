# INACTIVE — superseded by Cloudflare (see wrangler.toml and CLAUDE.md).
# This file is kept only for historical reference. The live site is deployed
# via `npx wrangler deploy` against the OpenNext build output. Do not wire
# any Netlify deploy to this repo without first coordinating with the
# Cloudflare configuration.

# Netlify build configuration for Next.js (rahul-photography)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Pin a stable Node LTS the Netlify build image actually ships.
  # (Your machine runs v26; the Netlify image may not have it yet.)
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Lenient dependency install: ignore audit/funding and skip strict
  # peer-dep failures that can kill `npm install` on the build image.
  NPM_FLAGS = "--no-audit --no-fund --legacy-peer-deps"